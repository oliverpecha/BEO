<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEO Console</title>
    <style>
        :root { --bg-main: #121212; --bg-panel: #1e1e1e; --text-main: #e0e0e0; --text-muted: #9e9e9e; --accent: #bb86fc; --border: #333; --sidebar-width: 220px; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar container */
        .sidebar { width: var(--sidebar-width); background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: margin-left 0.3s ease; z-index: 1000; flex-shrink: 0; }
        body.sidebar-collapsed .sidebar { margin-left: calc(var(--sidebar-width) * -1); }
        
        /* Floating toggle (only visible when collapsed) */
        .floating-toggle { position: absolute; top: 15px; left: 15px; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); font-size: 1.2rem; cursor: pointer; padding: 4px 10px; border-radius: 4px; z-index: 900; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        body.sidebar-collapsed .floating-toggle { opacity: 1; pointer-events: auto; }
        .floating-toggle:hover { background: #333; }
        
        .sidebar-header { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; white-space: nowrap; }
        
        /* Subtle SVG Collapse Icon */
        .close-toggle { background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 4px; transition: all 0.2s; }
        .close-toggle svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .close-toggle:hover { color: var(--text-main); background: #333; }
        
        .sidebar-menu { padding: 10px 0; list-style: none; margin: 0; }
        .sidebar-menu li a { display: block; padding: 15px 20px; color: var(--text-muted); text-decoration: none; transition: background 0.2s; white-space: nowrap; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background-color: #2c2c2c; color: var(--accent); border-left: 3px solid var(--accent); }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header sliding padding */
        .top-header { padding: 15px 20px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: padding-left 0.3s ease; }
        body.sidebar-collapsed .top-header { padding-left: 65px; }
        
        .clock-widget { font-family: monospace; font-size: 0.95rem; background: #252525; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); color: #9e9e9e; opacity: 0.8; }
        .content-area { padding: 20px; overflow-y: auto; flex: 1; }
        
        input[type="text"], input[type="date"] { background-color: #2c2c2c; color: var(--text-main); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; outline: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        input[type="date"] { position: relative; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; background-color: var(--bg-panel); border-radius: 8px; overflow: hidden; font-size: 0.9rem; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #252525; color: var(--text-muted); font-weight: 500; cursor: pointer; user-select: none; }
        th:hover { color: var(--text-main); }
        tr:hover { background-color: #2c2c2c; }
        a.action-btn { text-decoration: none; font-size: 1.2rem; display: inline-block; padding: 5px; background: #252525; border-radius: 4px; border: 1px solid var(--border); transition: background 0.2s; }
        a.action-btn:hover { background: #333; }

        details { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        summary { background: #252525; padding: 15px; font-weight: bold; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        summary:hover { background: #2c2c2c; }
        .details-body { padding: 20px; }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">

    <button class="floating-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>🩺 BEO Console</span>
            <button class="close-toggle" onclick="toggleSidebar()">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="/?token={{ token }}" class="{% if not time_val %}active{% endif %}">📑 Payload Logs</a></li>
            {% if time_val %}
            <li><a href="#" class="active" style="padding-left: 40px; border-left: none; color: var(--accent);">🔍 Inspector</a></li>
            {% endif %}
            <li><a href="#">💰 Financials <span style="font-size: 0.7em; opacity:0.5;">Soon</span></a></li>
            <li><a href="#">🔑 API Keys <span style="font-size: 0.7em; opacity:0.5;">Soon</span></a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="top-header">
            <h2 style="margin: 0; font-size: 1.5rem;">{% block title %}BEO Dashboard{% endblock %}</h2>
            <div class="clock-widget" id="utc-clock">VPS 🕒 --:--:-- UTC</div>
        </div>
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        function toggleSidebar() { document.body.classList.toggle('sidebar-collapsed'); }
        function updateClock() {
            const now = new Date();
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            document.getElementById('utc-clock').innerHTML = `VPS 🕒 ${months[now.getUTCMonth()]}-${String(now.getUTCDate()).padStart(2, '0')} ${now.toISOString().substring(11, 19)} UTC`;
        }
        setInterval(updateClock, 1000); updateClock();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
